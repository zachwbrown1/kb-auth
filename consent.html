<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Knowledge Base Sign-in</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --text:#1d1d1b; --muted:#6b6a66; --line:#e3e1dc; --accent:#1f6f4a; --accent-text:#fff; --danger:#a33; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141414; --card:#1d1d1d; --text:#ecebe8; --muted:#9b9a96; --line:#2e2e2e; --accent:#3fa874; --accent-text:#0d1a12; --danger:#e07070; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .card { width:100%; max-width:400px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p { margin:0 0 16px; color:var(--muted); }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--text); font-size:15px; }
  button { width:100%; margin-top:16px; padding:11px; border:0; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer;
           background:var(--accent); color:var(--accent-text); }
  button.secondary { background:transparent; color:var(--text); border:1px solid var(--line); margin-top:8px; }
  button:disabled { opacity:.6; cursor:default; }
  .app { font-weight:600; color:var(--text); }
  .scopes { font-size:13px; color:var(--muted); margin-top:-8px; }
  .err { color:var(--danger); font-size:14px; margin-top:12px; min-height:1em; }
  .hidden { display:none; }
</style>
</head>
<body>
<main class="card">
  <section id="loading"><h1>Knowledge Base</h1><p>Loading…</p></section>

  <section id="login" class="hidden">
    <h1>Knowledge Base</h1>
    <p>Sign in to let an app use your knowledge base.</p>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="loginBtn" type="submit">Sign in</button>
    </form>
  </section>

  <section id="consent" class="hidden">
    <h1>Allow access?</h1>
    <p><span class="app" id="appName">An app</span> wants to search and edit your knowledge base.</p>
    <p class="scopes" id="scopes"></p>
    <button id="approveBtn" type="button">Allow</button>
    <button id="denyBtn" type="button" class="secondary">Deny</button>
  </section>

  <section id="done" class="hidden"><h1>Done</h1><p id="doneMsg">You can close this window.</p></section>

  <div class="err" id="err"></div>
</main>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/+esm';

  const supabase = createClient(
    'https://cmbewpswzvrfzooicspv.supabase.co',
    'sb_publishable_3_5jyqeNo9AstBq3PWzZSQ_2knRQMYp'
  );
  const $ = (id) => document.getElementById(id);
  const show = (id) => ['loading', 'login', 'consent', 'done'].forEach((s) => $(s).classList.toggle('hidden', s !== id));
  const err = (m) => { $('err').textContent = m || ''; };

  const authorizationId = new URLSearchParams(location.search).get('authorization_id');

  async function loadConsent() {
    if (!authorizationId) { show('done'); $('doneMsg').textContent = 'Signed in. There is no pending app request.'; return; }
    const { data, error } = await supabase.auth.oauth.getAuthorizationDetails(authorizationId);
    if (error) { show('done'); $('doneMsg').textContent = ''; err(error.message); return; }
    if (data && data.redirect_url && !data.client) { location.assign(data.redirect_url); return; }
    $('appName').textContent = data?.client?.client_name || data?.client?.name || 'An app';
    $('scopes').textContent = data?.scope ? `Requested: ${data.scope}` : '';
    show('consent');
  }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault(); err('');
    $('loginBtn').disabled = true;
    const { error } = await supabase.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
    $('loginBtn').disabled = false;
    if (error) { err(error.message); return; }
    await loadConsent();
  });

  $('approveBtn').addEventListener('click', async () => {
    err(''); $('approveBtn').disabled = true; $('denyBtn').disabled = true;
    const { data, error } = await supabase.auth.oauth.approveAuthorization(authorizationId);
    if (error) { err(error.message); $('approveBtn').disabled = false; $('denyBtn').disabled = false; return; }
    show('done'); $('doneMsg').textContent = 'Approved. Returning to the app…';
    if (data?.redirect_url) location.assign(data.redirect_url);
  });

  $('denyBtn').addEventListener('click', async () => {
    err(''); $('approveBtn').disabled = true; $('denyBtn').disabled = true;
    const { data, error } = await supabase.auth.oauth.denyAuthorization(authorizationId);
    if (error) { err(error.message); return; }
    show('done'); $('doneMsg').textContent = 'Denied.';
    if (data?.redirect_url) location.assign(data.redirect_url);
  });

  const { data: { session } } = await supabase.auth.getSession();
  if (session) await loadConsent(); else show('login');
</script>
</body>
</html>
